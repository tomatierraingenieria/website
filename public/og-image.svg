<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Space+Grotesk:wght@400;500&amp;display=swap');
      .brand { font-family: 'Fraunces', Georgia, serif; font-weight: 600; }
      .sub   { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 500; }
      .tag   { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 400; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#faf9f6"/>

  <!-- Contour lines -->
  <ellipse cx="600" cy="660" rx="740" ry="340" fill="none" stroke="#dde8e2" stroke-width="1.2"/>
  <ellipse cx="600" cy="660" rx="580" ry="265" fill="none" stroke="#dde8e2" stroke-width="1.2"/>
  <ellipse cx="600" cy="660" rx="420" ry="190" fill="none" stroke="#dde8e2" stroke-width="1.2"/>
  <ellipse cx="600" cy="660" rx="260" ry="115" fill="none" stroke="#dde8e2" stroke-width="1.2"/>

  <!-- Logo mark -->
  <g transform="translate(540, 100) scale(2.5)">
    <path d="M60 30 C 52 24, 46 26, 44 18" fill="none" stroke="#3d7a53" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M60 30 C 68 24, 74 26, 76 18" fill="none" stroke="#3d7a53" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="60" y1="30" x2="60" y2="62" stroke="#6b4226" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="34" y1="72" x2="86" y2="72" stroke="#c8853a" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="42" y1="84" x2="78" y2="84" stroke="#c8853a" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="50" y1="96" x2="70" y2="96" stroke="#c8853a" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Brand name -->
  <text class="brand" x="600" y="390" font-size="80" fill="#1a3d2a" text-anchor="middle" letter-spacing="-1">tomatierra</text>
  <text class="sub" x="600" y="440" font-size="26" fill="#8b5e3c" text-anchor="middle" letter-spacing="8">INGENIERÍA</text>

  <!-- Tagline -->
  <text class="tag" x="600" y="510" font-size="22" fill="#3d7a53" text-anchor="middle" letter-spacing="0.5">Certificados Energéticos · CAE · Galicia</text>
</svg>
