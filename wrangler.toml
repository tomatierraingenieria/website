name = "tomatierra"
compatibility_date = "2025-01-01"

# Production environment
[env.production]
name = "tomatierra-production"

# Routes for production domain
[[env.production.routes]]
pattern = "https://tomatierraingenieria.com/*"
zone_name = "tomatierraingenieria.com"

[[env.production.routes]]
pattern = "https://www.tomatierraingenieria.com/*"
zone_name = "tomatierraingenieria.com"

# Caching strategy
[env.production.kv_namespaces]

[assets]
directory = "./dist"